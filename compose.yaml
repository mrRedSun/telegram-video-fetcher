services:
  bot:
    image: ghcr.io/mrredsun/telegram-video-fetcher:main
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /data
      TEMP_DIR: /tmp/downloads
      WORKERS: "3"
      QUEUE_SIZE: "64"
      MAX_URLS_PER_MESSAGE: "5"
      DOWNLOAD_TIMEOUT_SECONDS: "600"
    volumes:
      - bot-data:/data
    tmpfs:
      - /tmp/downloads:size=256m,mode=0700,uid=10001,gid=10001
    mem_limit: 2500m
    cpus: 6
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
